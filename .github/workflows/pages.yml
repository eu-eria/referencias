name: Página publicada

# A página publicada é o `index.html` da raiz — a plataforma inteira num
# arquivo, rodando no navegador.
#
# Ela fica na raiz de propósito: assim o GitHub Pages funciona no modo
# "Deploy from a branch", que serve a raiz da branch padrão direto, sem
# workflow nenhum. É o modo mais simples e é o que está em uso.
#
# Este arquivo, então, faz duas coisas:
#
#  1. `validar` — roda sempre e confere que a página continua inteira e
#     autossuficiente. É a rede de proteção contra um commit que quebre o que
#     já está no ar.
#
#  2. `publicar` — só entra em ação se você trocar Settings → Pages → Source
#     para "GitHub Actions". Fica desligado por padrão porque, no modo
#     "Deploy from a branch", o passo de deploy falharia e encheria o
#     histórico de execuções vermelhas sem motivo.
#     Para ligar: Settings → Secrets and variables → Actions → Variables →
#     nova variável `PAGES_VIA_ACTIONS` com valor `true`.

on:
  push:
    paths:
      - "index.html"
      - "social-card.png"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "index.html"
      - "social-card.png"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validar:
    name: Conferir a página
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp social-card.png _site/social-card.png
          # A plataforma é uma página só: qualquer caminho inexistente cai no
          # próprio app, em vez do 404 do GitHub.
          cp index.html _site/404.html
          # Sem isto o Jekyll entra no caminho e renderiza o README no lugar
          # do app — foi exatamente o que aconteceu na primeira publicação.
          touch _site/.nojekyll

      - name: Conferir a página
        run: |
          test -s _site/index.html
          grep -q '<!doctype html>' _site/index.html
          grep -q '<meta charset="utf-8">' _site/index.html
          grep -q 'name="viewport"' _site/index.html
          grep -q 'id="capture-input"' _site/index.html

          # A página tem de ser autossuficiente: nada de fonte, script ou
          # imagem vindos de outro domínio, senão ela quebra offline e sob
          # políticas de segurança restritivas.
          #
          # Só o que o navegador realmente busca conta. URL absoluta em
          # canonical e og:* é metadado — precisa ser absoluta, e passa.
          externo=$(
            {
              grep -oE 'src="https?://[^"]+"' _site/index.html || true
              grep -oE '<link[^>]+rel="(stylesheet|preload|prefetch|icon|apple-touch-icon|manifest)"[^>]*href="https?://[^"]+"' _site/index.html || true
              grep -oE '@import[^;]*https?://' _site/index.html || true
              grep -oE 'url\(\s*["'"'"']?https?://' _site/index.html || true
            }
          )
          if [ -n "$externo" ]; then
            echo "$externo"
            echo "::error file=index.html::A página carrega um recurso externo"
            exit 1
          fi

          echo "Página validada — $(wc -c < _site/index.html) bytes, nada externo"

      - name: Guardar o site montado
        if: vars.PAGES_VIA_ACTIONS == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    name: Publicar no Pages
    needs: validar
    # Desligado por padrão. Só faz sentido com Settings → Pages → Source em
    # "GitHub Actions"; no modo "Deploy from a branch" este passo falharia.
    if: >-
      vars.PAGES_VIA_ACTIONS == 'true' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
      - run: echo "No ar em ${{ steps.deploy.outputs.page_url }}"
