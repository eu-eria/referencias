  // Estudos de cor gerados no canvas — as capas dos links dependeriam de rede,
  // então o mural ganha imagens reais por outro caminho.
  const SEED_STUDIES = [
    { title: "Estudo de cor — terracota sobre grafite", tags: ["cor", "inspiracao"], board: 2, stops: ["#d97757", "#8a3c22", "#1b1b1d"], angle: 145 },
    { title: "Estudo de cor — verde-musgo e areia", tags: ["cor", "paleta"], board: 2, stops: ["#5b9279", "#c9bfa4", "#2c3a33"], angle: 32 },
    { title: "Textura de fundo — malha suave", tags: ["cor", "recurso"], board: 0, stops: ["#4a86c5", "#8a6fc4", "#101018"], angle: 210 },
  ];

  function paintStudy({ stops, angle }) {
    const canvas = document.createElement("canvas");
    canvas.width = 900; canvas.height = 620;
    const ctx = canvas.getContext("2d");
    const radians = (angle * Math.PI) / 180;
    const gradient = ctx.createLinearGradient(
      0, 0, Math.cos(radians) * canvas.width, Math.sin(radians) * canvas.height,
    );
    stops.forEach((color, i) => gradient.addColorStop(i / (stops.length - 1), color));
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // manchas suaves por cima, pra não ficar um degradê chapado
    for (let i = 0; i < 5; i++) {
      const x = (i * 197) % canvas.width, y = (i * 139) % canvas.height;
      const radius = 150 + i * 60;
      const blob = ctx.createRadialGradient(x, y, 0, x, y, radius);
      blob.addColorStop(0, stops[(i + 1) % stops.length] + "44");
      blob.addColorStop(1, "transparent");
      ctx.fillStyle = blob;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    return new Promise((resolve) => canvas.toBlob(resolve, "image/webp", 0.86));
  }

  async function buildSeed() {
    const now = Date.now(), hour = 3600000;

    const boards = SEED_BOARDS.map((board, i) => Object.assign({}, board, {
      id: "seed-board-" + i, position: i,
      createdAt: now - (SEED_BOARDS.length - i) * hour,
      updatedAt: now - (SEED_BOARDS.length - i) * hour,
    }));

    const items = [];

    SEED_LINKS.forEach((link, i) => {
      const createdAt = now - (i + 1) * hour * 5;
      items.push({
        id: "seed-link-" + i, kind: "link", title: link.title, url: link.url,
        description: link.description, siteName: hostOf(link.url),
        boardIds: [boards[link.board].id], tags: link.tags,
        favorite: i < 2, createdAt, updatedAt: createdAt,
      });
    });

    SEED_NOTES.forEach((note, i) => {
      const createdAt = now - (i + 1) * hour * 2;
      items.push({
        id: "seed-note-" + i, kind: "note", title: note.title, description: note.body,
        boardIds: [boards[note.board].id], tags: note.tags,
        favorite: i === 0, createdAt, updatedAt: createdAt,
      });
    });

    for (let i = 0; i < SEED_STUDIES.length; i++) {
      const study = SEED_STUDIES[i];
      const createdAt = now - (i + 1) * hour * 9;
      items.push({
        id: "seed-study-" + i, kind: "image", title: study.title,
        imageBlob: await paintStudy(study), imageRatio: 900 / 620,
        boardIds: [boards[study.board].id], tags: study.tags,
        favorite: false, createdAt, updatedAt: createdAt,
      });
    }

    return { boards, items };
  }

  /* ═══════════════════════════ recortes ═══════════════════════════ */

  function selectionKey(sel) {
    return sel.type === "board" ? "board:" + sel.id
      : sel.type === "tag" ? "tag:" + sel.name : sel.type;
  }

  function visibleItems() {
    let result = state.items;
    const sel = state.selection;

    if (sel.type === "favoritos") result = result.filter((i) => i.favorite);
    else if (sel.type === "recentes") {
      result = result.filter((i) => i.openedAt)
        .sort((a, b) => (b.openedAt || 0) - (a.openedAt || 0)).slice(0, 60);
    } else if (sel.type === "soltos") result = result.filter((i) => i.boardIds.length === 0);
    else if (sel.type === "board") result = result.filter((i) => i.boardIds.includes(sel.id));
    else if (sel.type === "tag") result = result.filter((i) => i.tags.includes(sel.name));

    if (state.kinds.length) result = result.filter((i) => state.kinds.includes(i.kind));

    if (state.query.trim()) return searchItems(result, state.query);
    if (sel.type === "recentes") return result;

    const sorted = result.slice();
    if (state.sort === "antigos") sorted.sort((a, b) => a.createdAt - b.createdAt);
    else if (state.sort === "titulo") sorted.sort((a, b) => a.title.localeCompare(b.title, "pt-BR"));
    else if (state.sort === "abertos") sorted.sort((a, b) => (b.openedAt || 0) - (a.openedAt || 0));
    else sorted.sort((a, b) => b.createdAt - a.createdAt);
    return sorted;
  }

  function relatedTo(item) {
    const tags = new Set(item.tags), boards = new Set(item.boardIds);
    const host = hostOf(item.url);
    return state.items
      .filter((c) => c.id !== item.id)
      .map((candidate) => {
        let score = 0;
        candidate.tags.forEach((t) => { if (tags.has(t)) score += 3; });
        candidate.boardIds.forEach((b) => { if (boards.has(b)) score += 2; });
        if (host && hostOf(candidate.url) === host) score += 2;
        return { candidate, score };
      })
      .filter((entry) => entry.score > 0)
      .sort((a, b) => b.score - a.score || b.candidate.createdAt - a.candidate.createdAt)
      .slice(0, 6)
      .map((entry) => entry.candidate);
  }

  function headerFor(sel) {
    if (sel.type === "favoritos") return ["Favoritos", "O que você marcou como essencial"];
    if (sel.type === "recentes") return ["Vistos recentemente", "Na ordem em que você abriu"];
    if (sel.type === "soltos") return ["Sem board", "Referências que ainda não foram organizadas"];
    if (sel.type === "board") {
      const board = state.boards.find((b) => b.id === sel.id);
      return board ? [board.emoji + " " + board.name, board.description || ""] : ["Board", ""];
    }
    if (sel.type === "tag") return ["#" + sel.name, "Filtrando por tag"];
    return ["Tudo", "Todo o seu acervo, do mais novo ao mais antigo"];
  }

  /* ═══════════════════════════ avisos ═════════════════════════════ */

  const toastTimers = new Map();

  function toast(message, options = {}) {
    const id = uid();
    const node = el("div", { class: "toast", dataset: { tone: options.tone || "info" }, role: "status" }, [
      options.tone === "success" ? svg(ICON.check, 15) : null,
      el("span", { class: "t-text", text: message }),
      options.action
        ? el("button", { class: "t-action", text: options.action.label,
            onclick: () => { options.action.run(); dismissToast(id); } })
        : null,
      el("button", { class: "icon-btn", "aria-label": "Fechar aviso", onclick: () => dismissToast(id),
        html: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">${ICON.close}</svg>` }),
    ]);
    node.dataset.toastId = id;
    $("toasts").append(node);
    while ($("toasts").children.length > 3) $("toasts").firstElementChild.remove();
    toastTimers.set(id, setTimeout(() => dismissToast(id), options.action ? 7000 : 3600));
    return id;
  }

  function dismissToast(id) {
    clearTimeout(toastTimers.get(id));
    toastTimers.delete(id);
    const node = $("toasts").querySelector(`[data-toast-id="${id}"]`);
    if (node) node.remove();
  }

  /* ═══════════════════════════ capas ══════════════════════════════ */

  function cover(item, { aspect = "auto", compact = false } = {}) {
    const url = coverUrl(item);
    const box = el("div", { class: "cover" });

    if (aspect === "square") box.style.aspectRatio = "1";
    else if (aspect === "video") box.style.aspectRatio = "16 / 9";
    else if (url && item.imageRatio) box.style.aspectRatio = String(item.imageRatio);

    if (url) {
      box.append(el("img", { src: url, alt: "", loading: "lazy", decoding: "async" }));
      return box;
    }

    const base = colorFromString(hostOf(item.url) || item.title || item.id);
    box.classList.add("cover-fallback");

    if (compact) {
      box.style.background = base + "22";
      if (item.kind === "note") {
        const icon = svg(ICON.note, 14);
        icon.style.color = base;
        box.append(icon);
      } else {
        box.append(el("span", {
          class: "cover-label", style: `color:${base};letter-spacing:0`,
          text: (hostOf(item.url) || item.title || "?").charAt(0).toUpperCase(),
        }));
      }
      return box;
    }

    if (aspect === "auto") box.style.aspectRatio = "5 / 2";

    if (item.kind === "note") {
      box.style.background = `linear-gradient(150deg, ${base}22, ${base}0d 60%, transparent)`;
      const icon = svg(ICON.note, 24);
      icon.style.color = "var(--text-faint)";
      box.append(icon);
    } else {
      box.style.background =
        `radial-gradient(120% 100% at 20% 0%, ${base}40, ${base}14 45%, var(--bg-sunken) 100%)`;
      box.append(el("span", {
        class: "cover-label", style: `color:${base}`,
        text: (hostOf(item.url) || item.title || "referência").slice(0, 28),
      }));
    }
    return box;
  }

  /* ═════════════════════════ render: rail ═════════════════════════ */

  function renderRail() {
    const nav = $("rail-nav");
    nav.replaceChildren();

    $("rail-count").textContent =
      state.items.length + (state.items.length === 1 ? " item salvo" : " itens salvos");

    const boardCounts = new Map(), tagCounts = new Map();
    for (const item of state.items) {
      item.boardIds.forEach((id) => boardCounts.set(id, (boardCounts.get(id) || 0) + 1));
      item.tags.forEach((tag) => tagCounts.set(tag, (tagCounts.get(tag) || 0) + 1));
    }

    const current = selectionKey(state.selection);
    const group = () => el("div", { style: "display:flex;flex-direction:column;gap:2px" });

    const navRow = ({ icon, label, count, key, onclick, accent, board }) => {
      const row = el("div", { class: "nav-row" });
      const button = el("button", {
        class: "nav", "aria-current": current === key ? "true" : "false", onclick,
      }, [
        el("span", { class: "nav-icon", style: current === key && accent ? `color:${accent}` : "" },
          [typeof icon === "string" ? document.createTextNode(icon) : icon]),
        el("span", { class: "nav-label", text: label }),
        count ? el("span", { class: "nav-count", text: String(count) }) : null,
      ]);
      row.append(button);
      if (board) {
        row.append(el("button", {
          class: "nav-edit", "aria-label": "Editar " + board.name,
          onclick: (event) => { event.stopPropagation(); openBoardDialog(board); },
          html: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON.edit}</svg>`,
        }));
      }
      return row;
    };

    const quick = group();
    quick.append(
      navRow({ icon: svg(ICON.board, 15), label: "Tudo", count: state.items.length, key: "todos",
        onclick: () => select({ type: "todos" }) }),
      navRow({ icon: svg(ICON.star, 15), label: "Favoritos", key: "favoritos",
        count: state.items.filter((i) => i.favorite).length,
        onclick: () => select({ type: "favoritos" }) }),
      navRow({ icon: svg(ICON.clock, 15), label: "Vistos recentemente", key: "recentes",
        onclick: () => select({ type: "recentes" }) }),
    );
    const loose = state.items.filter((i) => i.boardIds.length === 0).length;
    if (loose) {
      quick.append(navRow({ icon: svg(ICON.tag, 15), label: "Sem board", count: loose, key: "soltos",
        onclick: () => select({ type: "soltos" }) }));
    }
    nav.append(quick);

    nav.append(el("div", { class: "group-title" }, [
      el("span", { text: "Boards" }),
      el("button", { class: "icon-btn", style: "padding:4px", "aria-label": "Criar board",
        onclick: () => openBoardDialog(null),
        html: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">${ICON.plus}</svg>` }),
    ]));

    const boards = group();
    if (!state.boards.length) {
      boards.append(el("p", {
        style: "margin:0;padding:8px 10px;font-size:12px;line-height:1.55;color:var(--text-faint)",
        text: "Boards agrupam referências por assunto. Crie o primeiro no + acima.",
      }));
    }
    state.boards.forEach((board) => {
      boards.append(navRow({
        icon: board.emoji, label: board.name, count: boardCounts.get(board.id) || 0,
        key: "board:" + board.id, accent: board.color, board,
        onclick: () => select({ type: "board", id: board.id }),
      }));
    });
    nav.append(boards);

    const tags = [...tagCounts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    if (tags.length) {
      nav.append(el("div", { class: "group-title" }, [el("span", { text: "Tags" })]));
      const list = group();
      const limit = state.showAllTags ? tags.length : 8;
      tags.slice(0, limit).forEach(([tag, count]) => {
        list.append(navRow({ icon: svg(ICON.tag, 14), label: tag, count, key: "tag:" + tag,
          onclick: () => select({ type: "tag", name: tag }) }));
      });
      if (tags.length > 8) {
        list.append(el("button", {
          class: "nav", style: "font-size:11.5px;color:var(--text-faint)",
          text: state.showAllTags ? "Mostrar menos" : `Ver todas as ${tags.length} tags`,
          onclick: () => { state.showAllTags = !state.showAllTags; renderRail(); },
        }));
      }
      nav.append(list);
    }
  }

  /* ════════════════════════ render: cabeçalho ═════════════════════ */

  function renderHead() {
    const [title, description] = headerFor(state.selection);
    $("head-title").textContent = title;
    $("head-desc").textContent = description;

    const select_ = $("board-select");
    const chosen = select_.value;
    select_.replaceChildren(el("option", { value: "", text: "Sem board" }));
    state.boards.forEach((board) =>
      select_.append(el("option", { value: board.id, text: board.emoji + " " + board.name })));
    select_.value = state.selection.type === "board" ? state.selection.id
      : state.boards.some((b) => b.id === chosen) ? chosen : "";

    const chips = $("kind-chips");
    chips.replaceChildren();
    Object.entries(KIND_LABEL).forEach(([kind, label]) => {
      chips.append(el("button", {
        class: "chip", "aria-pressed": state.kinds.includes(kind) ? "true" : "false", text: label,
        onclick: () => {
          state.kinds = state.kinds.includes(kind)
            ? state.kinds.filter((k) => k !== kind) : state.kinds.concat(kind);
          state.focusedId = null;
          renderHead(); renderGrid();
        },
      }));
    });

    const views = $("view-switch");
    views.replaceChildren();
    [["mural", "Mural"], ["grade", "Grade"], ["lista", "Lista"]].forEach(([key, label]) => {
      views.append(el("button", {
        class: "seg", "aria-pressed": state.view === key ? "true" : "false",
        "aria-label": label, title: "Visualização em " + label.toLowerCase(),
        onclick: () => { state.view = key; persistPrefs(); renderHead(); renderGrid(); },
        html: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON[key]}</svg>`,
      }));
    });

    $("sort-select").value = state.sort;
    $("filter-clear").classList.toggle("hidden", !state.query);
    $("theme-btn").innerHTML =
      `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${resolvedTheme() === "dark" ? ICON.sun : ICON.moon}</svg>`;
  }

  /* ═══════════════════════ render: mural ══════════════════════════ */

  function tagChip(tag) {
    return el("button", { class: "tag", text: tag, tabindex: "-1",
      onclick: (event) => { event.stopPropagation(); select({ type: "tag", name: tag }); } });
  }

  function itemActions(item) {
    const box = el("div", { class: "card-actions" });
    box.append(el("button", {
      class: "act", dataset: { on: item.favorite ? "true" : "false" },
      "aria-label": (item.favorite ? "Remover dos favoritos: " : "Favoritar: ") + item.title,
      onclick: (event) => { event.stopPropagation(); toggleFavorite(item.id); },
      html: `<svg width="14" height="14" viewBox="0 0 24 24" fill="${item.favorite ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${ICON.star}</svg>`,
    }));
    if (item.url) {
      box.append(el("button", {
        class: "act", "aria-label": "Abrir o link original: " + item.title,
        onclick: (event) => { event.stopPropagation(); openSource(item); },
        html: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON.external}</svg>`,
      }));
    }
    return box;
  }

  function cardFor(item) {
    const focused = state.focusedId === item.id;

    if (state.view === "lista") {
      const row = el("div", { class: "row", dataset: { itemId: item.id, focused: String(focused) },
        ondblclick: () => openSource(item) }, [
        (() => { const t = el("div", { class: "thumb" }); t.append(cover(item, { aspect: "square", compact: true })); return t; })(),
        el("div", { class: "row-main" }, [
          el("h3", { class: "row-title" }, [
            el("button", { class: "title-btn", text: item.title, onclick: () => openDetail(item.id) }),
            item.favorite
              ? el("span", { style: "color:var(--accent);display:grid;flex:none",
                  html: `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${ICON.star}</svg>` })
              : null,
          ]),
          el("p", { class: "row-sub", style: "margin:2px 0 0",
            text: item.description || hostOf(item.url) || (item.kind === "note" ? "Nota" : "Imagem") }),
        ]),
        el("div", { class: "tags" }, item.tags.slice(0, 3).map(tagChip)),
        el("time", { text: timeAgo(item.createdAt) }),
        itemActions(item),
      ]);
      return row;
    }

    const isGrid = state.view === "grade";
    const showCover = item.kind !== "note";
    const card = el("article", {
      class: "card" + (item.kind === "note" ? " card-note" : ""),
      dataset: { itemId: item.id, focused: String(focused) },
      ondblclick: () => openSource(item),
    });

    if (showCover) {
      const wrap_ = el("div", { style: "position:relative" });
      wrap_.append(cover(item, { aspect: isGrid ? "video" : "auto" }));

      const boards = state.boards.filter((b) => item.boardIds.includes(b.id)).slice(0, 2);
      if (boards.length) {
        wrap_.append(el("div", { class: "card-boards" },
          boards.map((board) => el("span", { class: "board-chip", text: board.emoji + " " + board.name }))));
      }
      wrap_.append(itemActions(item));
      if (item.favorite) {
        wrap_.append(el("span", { class: "fav-mark",
          html: `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${ICON.star}</svg>` }));
      }
      card.append(wrap_);
    } else {
      card.append(itemActions(item));
    }

    const body = el("div", { class: "card-body" });
    if (!showCover && item.favorite) {
      body.append(el("span", { class: "fav-mark", style: "color:var(--accent)",
        html: `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${ICON.star}</svg>` }));
    }

    body.append(el("h3", { class: "card-title" }, [
      el("button", { class: "title-btn", text: item.title, onclick: () => openDetail(item.id) }),
    ]));

    if (item.kind === "note" && item.description) {
      body.append(el("p", { class: "card-excerpt", style: "margin:0", text: item.description }));
    }

    const meta = el("div", { class: "card-meta" });
    if (item.kind === "note") { meta.append(svg(ICON.note, 12), el("span", { text: "Nota" })); }
    else if (item.kind === "image") { meta.append(svg(ICON.image, 12), el("span", { text: "Imagem" })); }
    else { meta.append(el("span", { class: "host", text: hostOf(item.url) || "referência" })); }
    meta.append(el("span", { "aria-hidden": "true", text: "·" }),
      el("time", { text: timeAgo(item.createdAt) }));
    body.append(meta);

    if (item.tags.length) {
      const max = isGrid ? 2 : 4;
      const tags = el("div", { class: "tags" }, item.tags.slice(0, max).map(tagChip));
      if (item.tags.length > max) {
        tags.append(el("span", { class: "tag-more", text: "+" + (item.tags.length - max) }));
      }
      body.append(tags);
    }

    card.append(body);
    return card;
  }

  function renderGrid() {
    const items = visibleItems();
    const grid = $("grid");
    grid.className = state.view;
    grid.replaceChildren();

    $("result-count").textContent =
      items.length + (items.length === 1 ? " referência" : " referências");

    if (!state.ready) {
      grid.className = "mural";
      [220, 300, 180, 260, 200, 320, 240, 190].forEach((height) => {
        grid.append(el("div", {
          class: "card",
          style: `height:${height}px;opacity:.5;animation:fade .4s ease-out alternate infinite`,
        }));
      });
      return;
    }

    if (!items.length) { grid.className = ""; grid.append(emptyState()); return; }
    items.forEach((item) => grid.append(cardFor(item)));
  }

  function emptyState() {
    const filtering = state.query.trim().length > 0;
    const sel = state.selection.type;
    let title, body, action = null;

    if (filtering) {
      title = `Nada encontrado para “${state.query.trim()}”`;
      body = "Tente outra palavra, ou limpe os filtros pra ver tudo de novo.";
      action = { label: "Limpar filtros", run: clearFilters };
    } else if (!state.items.length) {
      title = "Seu acervo começa aqui";
      body = "Cole um link na barra de cima, escreva uma ideia ou arraste uma imagem pra dentro da janela.";
      action = { label: "Adicionar a primeira referência", run: focusCapture };
    } else if (sel === "board") {
      title = "Board vazio por enquanto";
      body = "Salve algo com este board selecionado na barra de captura, ou abra uma referência e marque este board no painel de detalhe.";
      action = { label: "Adicionar referência", run: focusCapture };
    } else if (sel === "favoritos") {
      title = "Nenhum favorito ainda";
      body = "Aperte F sobre um card (ou clique na estrela) pra deixar as referências mais importantes sempre à mão.";
    } else if (sel === "recentes") {
      title = "Nada aberto ainda nesta sessão";
      body = "As referências que você abrir aparecem aqui, na ordem em que foram consultadas.";
    } else {
      title = "Nada por aqui";
      body = "Nenhuma referência corresponde a este recorte.";
      action = { label: "Ver tudo", run: clearFilters };
    }

    return el("div", { class: "empty" }, [
      el("span", { class: "empty-badge",
        html: `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${filtering ? ICON.search : ICON.spark}</svg>` }),
      el("h2", { text: title }),
      el("p", { text: body }),
      action ? el("button", { class: "btn btn-primary", text: action.label, onclick: action.run }) : null,
    ]);
  }

  /* ═══════════════════════ gaveta de detalhe ══════════════════════ */

  let overlayStack = [];

  /**
   * Registra uma sobreposição e devolve a função que a fecha. `onDismiss`
   * existe para que Esc feche pelo mesmo caminho de quem clicou fora — a
   * gaveta, por exemplo, precisa limpar o `detailId` junto.
   */
  function mountOverlay(nodes, onDismiss) {
    const list = [].concat(nodes);
    const entry = { nodes: list, onDismiss: null };
    const dismiss = () => {
      overlayStack = overlayStack.filter((e) => e !== entry);
      list.forEach((node) => node.remove());
    };
    entry.onDismiss = onDismiss ? () => onDismiss(dismiss) : dismiss;
    overlayStack.push(entry);
    list.forEach((node) => $("overlays").append(node));
    return dismiss;
  }

  function closeTopOverlay() {
    const top = overlayStack[overlayStack.length - 1];
    if (top) { top.onDismiss(); return true; }
    return false;
  }

  function openDetail(id) {
    state.detailId = id;
    state.focusedId = id;
    touchOpened(id);
    renderGrid();
    renderDetail();
  }

  function closeDetail() {
    state.detailId = null;
    if (detailClose) { detailClose(); detailClose = null; }
    renderGrid();
  }

  let detailClose = null;

  function renderDetail() {
    if (detailClose) { detailClose(); detailClose = null; }
    const item = state.items.find((i) => i.id === state.detailId);
    if (!item) return;

    const list = visibleItems();
    const index = list.findIndex((i) => i.id === item.id);

    const scrim = el("div", { class: "scrim", onclick: closeDetail });
    const panel = el("aside", { class: "drawer", role: "dialog", "aria-modal": "true", "aria-label": item.title });

    const navButton = (direction, label, enabled) => el("button", {
      class: "icon-btn", "aria-label": label, disabled: !enabled,
      style: enabled ? "" : "opacity:.3;cursor:default",
      onclick: () => { if (enabled) openDetail(list[index + direction].id); },
      html: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${direction === -1 ? 180 : 0}deg)">${ICON.chevron}</svg>`,
    });

    panel.append(el("header", { class: "drawer-head" }, [
      el("button", { class: "icon-btn", "aria-label": "Fechar (Esc)", onclick: closeDetail,
        html: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">${ICON.close}</svg>` }),
      el("span", { class: "spacer" }),
      navButton(-1, "Referência anterior (K)", index > 0),
      navButton(1, "Próxima referência (J)", index >= 0 && index < list.length - 1),
      el("span", { style: "width:1px;height:16px;background:var(--border);margin:0 4px" }),
      el("button", {
        class: "icon-btn", "aria-label": item.favorite ? "Remover dos favoritos" : "Favoritar (F)",
        style: item.favorite ? "color:var(--accent)" : "",
        onclick: () => toggleFavorite(item.id),
        html: `<svg width="16" height="16" viewBox="0 0 24 24" fill="${item.favorite ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${ICON.star}</svg>` }),
      el("button", {
        class: "icon-btn", "aria-label": "Excluir referência", style: "color:var(--text-faint)",
        onclick: () => removeItem(item),
        html: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON.trash}</svg>` }),
    ]));

    const body = el("div", { class: "drawer-body" });
    if (item.imageBlob) {
      const box = cover(item, { aspect: "auto" });
      box.classList.add("drawer-cover");
      body.append(box);
    }

    const content = el("div", { class: "drawer-content" });

    const titleField = el("textarea", { class: "drawer-title", rows: "1" });
    titleField.value = item.title;
    const growTitle = () => {
      titleField.style.height = "auto";
      titleField.style.height = titleField.scrollHeight + "px";
    };
    titleField.addEventListener("input", growTitle);
    titleField.addEventListener("blur", () => {
      const next = titleField.value.trim();
      if (next && next !== item.title) { updateItem(item.id, { title: next }).then(afterEdit); }
      else if (!next) titleField.value = item.title;
    });
    titleField.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { event.preventDefault(); titleField.blur(); }
    });

    const meta = el("div", { class: "drawer-meta" });
    const host = hostOf(item.url);
    if (host) meta.append(el("span", { class: "host", text: host }), el("span", { text: "·" }));
    meta.append(el("span", { text: "Salvo em " + formatDate(item.createdAt) }));

    content.append(el("div", {}, [titleField, meta]));

    if (item.url) {
      content.append(el("div", { style: "display:flex;gap:8px;flex-wrap:wrap" }, [
        el("button", { class: "btn btn-primary", style: "flex:1;justify-content:center",
          onclick: () => openSource(item) }, [svg(ICON.external, 15), "Abrir original"]),
        el("button", { class: "btn btn-ghost", onclick: (event) => copyUrl(item, event.currentTarget) },
          [svg(ICON.copy, 15), "Copiar link"]),
      ]));
    }

    if (item.description) {
      content.append(el("section", {}, [
        el("span", { class: "field-label", text: item.kind === "note" ? "Conteúdo" : "Resumo" }),
        el("p", { class: "prose", text: item.description }),
      ]));
    }

    const notes = el("textarea", {
      class: "textarea", rows: "3",
      placeholder: "Por que isso importa? O que você quer reaproveitar daqui?",
    });
    notes.value = item.notes || "";
    notes.addEventListener("blur", () => {
      const next = notes.value.trim();
      if (next !== (item.notes || "")) updateItem(item.id, { notes: next || undefined }).then(afterEdit);
    });
    content.append(el("section", {}, [
      el("span", { class: "field-label", text: "Suas anotações" }), notes,
    ]));

    const tagBox = el("div", { class: "tag-editor" });
    item.tags.forEach((tag) => {
      tagBox.append(el("span", { class: "tag-pill" }, [
        el("button", { text: tag, style: "padding:0;color:inherit",
          onclick: () => { closeDetail(); select({ type: "tag", name: tag }); } }),
        el("button", { "aria-label": "Remover tag " + tag,
          onclick: () => updateItem(item.id, { tags: item.tags.filter((t) => t !== tag) }).then(afterEdit),
          html: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${ICON.close}</svg>` }),
      ]));
    });
    const tagInput = el("input", { id: "tag-input", placeholder: "+ tag" });
    const commitTag = () => {
      const tag = slugifyTag(tagInput.value);
      tagInput.value = "";
      if (!tag || item.tags.includes(tag)) return;
      updateItem(item.id, { tags: item.tags.concat(tag) }).then(afterEdit);
    };
    tagInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === ",") { event.preventDefault(); commitTag(); }
      else if (event.key === "Backspace" && !tagInput.value && item.tags.length) {
        updateItem(item.id, { tags: item.tags.slice(0, -1) }).then(afterEdit);
      } else if (event.key === "Escape" && tagInput.value) {
        event.stopPropagation(); tagInput.value = "";
      }
    });
    tagInput.addEventListener("blur", () => { if (tagInput.value) commitTag(); });
    tagBox.append(tagInput);
    content.append(el("section", {}, [el("span", { class: "field-label", text: "Tags" }), tagBox]));

    const boardBox = el("div", { style: "display:flex;flex-wrap:wrap;gap:6px" });
    if (!state.boards.length) {
      boardBox.append(el("p", { class: "prose", style: "font-size:12px", text: "Nenhum board criado ainda." }));
    }
    state.boards.forEach((board) => {
      const on = item.boardIds.includes(board.id);
      boardBox.append(el("button", {
        class: "board-toggle", "aria-pressed": on ? "true" : "false",
        onclick: () => updateItem(item.id, {
          boardIds: on ? item.boardIds.filter((b) => b !== board.id) : item.boardIds.concat(board.id),
        }).then(afterEdit),
      }, [
        el("span", { text: board.emoji }), board.name,
        svg(on ? ICON.check : ICON.plus, 11),
      ]));
    });
    content.append(el("section", {}, [el("span", { class: "field-label", text: "Boards" }), boardBox]));

    const related = relatedTo(item);
    if (related.length) {
      const list_ = el("div", { class: "related" });
      related.forEach((candidate) => {
        const thumb = el("div", { class: "thumb" });
        thumb.append(cover(candidate, { aspect: "square", compact: true }));
        list_.append(el("button", { class: "related-row", onclick: () => openDetail(candidate.id) }, [
          thumb,
          el("span", { class: "rel-main" }, [
            el("span", { class: "rel-title", text: candidate.title }),
            el("span", { class: "rel-sub",
              text: candidate.tags.slice(0, 3).join(" · ") || hostOf(candidate.url) || "Nota" }),
          ]),
          svg(ICON.chevron, 14),
        ]));
      });
      content.append(el("section", {}, [
        el("span", { class: "field-label", text: "Relacionadas" }), list_,
      ]));
    }

    body.append(content);
    panel.append(body);

    detailClose = mountOverlay([scrim, panel], () => closeDetail());
    requestAnimationFrame(growTitle);
  }

  function afterEdit() {
    renderRail(); renderGrid();
    if (state.detailId) renderDetail();
  }

  async function copyUrl(item, button) {
    try {
      await navigator.clipboard.writeText(item.url);
      button.replaceChildren(svg(ICON.check, 15), document.createTextNode("Copiado"));
      setTimeout(() => button.replaceChildren(svg(ICON.copy, 15), document.createTextNode("Copiar link")), 1600);
    } catch {
      toast("Não consegui copiar — o navegador bloqueou", { tone: "error" });
    }
  }

  /* ══════════════════════════ paleta ⌘K ═══════════════════════════ */

  function openPalette() {
    let rows = [], active = 0;

    const input = el("input", { id: "palette-input", placeholder: "Buscar referência, board ou tag…", autocomplete: "off" });
    const list = el("div", { class: "palette-list" });

    const panel = el("div", { class: "palette", role: "dialog", "aria-modal": "true", "aria-label": "Busca rápida" }, [
      el("div", { class: "palette-input-row" }, [
        svg(ICON.search, 17), input,
        el("kbd", { text: "esc" }),
      ]),
      list,
      el("div", { class: "palette-foot" }, [
        el("span", {}, [el("kbd", { text: "↑↓" }), " navegar"]),
        el("span", {}, [el("kbd", { text: "↵" }), " abrir"]),
        el("span", {}, [el("kbd", { text: "esc" }), " fechar"]),
      ]),
    ]);

    const scrim = el("div", { class: "palette-scrim" });
    scrim.append(panel);
    scrim.addEventListener("click", (event) => { if (event.target === scrim) dismiss(); });

    const dismiss = mountOverlay(scrim);

    function build() {
      const query = input.value.trim();
      rows = [];

      if (!query) {
        state.items.slice()
          .sort((a, b) => (b.openedAt || b.createdAt) - (a.openedAt || a.createdAt))
          .slice(0, 6)
          .forEach((item) => rows.push({
            group: "Continuar de onde parou", label: item.title, item,
            hint: hostOf(item.url) || (item.kind === "note" ? "nota" : "imagem"),
            run: () => openDetail(item.id),
          }));
      } else {
        searchItems(state.items, query).slice(0, 8).forEach((item) => rows.push({
          group: "Referências", label: item.title, item,
          hint: hostOf(item.url) || (item.kind === "note" ? "nota" : "imagem"),
          run: () => openDetail(item.id),
        }));

        state.boards
          .map((board) => ({ board, score: fuzzy(query, board.name) }))
          .filter((entry) => entry.score)
          .sort((a, b) => b.score - a.score).slice(0, 4)
          .forEach(({ board }) => rows.push({
            group: "Boards", label: board.emoji + " " + board.name, hint: "board",
            icon: ICON.board, run: () => select({ type: "board", id: board.id }),
          }));

        const tags = new Set();
        state.items.forEach((item) => item.tags.forEach((t) => tags.add(t)));
        [...tags].map((tag) => ({ tag, score: fuzzy(query, tag) }))
          .filter((entry) => entry.score)
          .sort((a, b) => b.score - a.score).slice(0, 5)
          .forEach(({ tag }) => rows.push({
            group: "Tags", label: tag, hint: "tag", icon: ICON.tag,
            run: () => select({ type: "tag", name: tag }),
          }));
      }

      rows.push(
        { group: "Ações", label: "Adicionar referência", hint: "A", icon: ICON.plus, run: focusCapture },
        { group: "Ações", label: "Criar novo board", hint: "B", icon: ICON.board, run: () => openBoardDialog(null) },
        { group: "Ações", label: "Ver favoritos", icon: ICON.star, run: () => select({ type: "favoritos" }) },
        { group: "Ações", label: "Atalhos do teclado", hint: "?", icon: ICON.spark, run: openShortcuts },
      );

      active = 0;
      paint();
    }

    function paint() {
      list.replaceChildren();
      if (!rows.length) {
        list.append(el("p", { style: "padding:32px 12px;text-align:center;font-size:13px;color:var(--text-faint)",
          text: `Nada encontrado para “${input.value.trim()}”.` }));
        return;
      }
      let lastGroup = "";
      rows.forEach((row, index) => {
        if (row.group !== lastGroup) {
          lastGroup = row.group;
          list.append(el("p", { class: "palette-group", style: "margin:0", text: row.group }));
        }
        const button = el("button", {
          class: "palette-row", dataset: { active: index === active ? "true" : "false", index: String(index) },
          onmousemove: () => { if (active !== index) { active = index; paint(); } },
          onclick: () => { row.run(); dismiss(); },
        });
        if (row.item) {
          const thumb = el("div", { class: "thumb" });
          thumb.append(cover(row.item, { aspect: "square", compact: true }));
          button.append(thumb);
        } else {
          button.append(el("span", { class: "p-icon" }, [svg(row.icon || ICON.spark, 15)]));
        }
        button.append(el("span", { class: "p-label", text: row.label }));
        if (row.hint) button.append(el("span", { class: "p-hint", text: row.hint }));
        list.append(button);
      });
      const activeNode = list.querySelector('[data-active="true"]');
      if (activeNode) activeNode.scrollIntoView({ block: "nearest" });
    }

    input.addEventListener("input", build);
    panel.addEventListener("keydown", (event) => {
      if (event.key === "ArrowDown") { event.preventDefault(); active = (active + 1) % rows.length; paint(); }
      else if (event.key === "ArrowUp") { event.preventDefault(); active = (active - 1 + rows.length) % rows.length; paint(); }
      else if (event.key === "Enter") { event.preventDefault(); const row = rows[active]; if (row) { row.run(); dismiss(); } }
      else if (event.key === "Escape") { event.preventDefault(); event.stopPropagation(); dismiss(); }
    });

    build();
    input.focus();
  }

  /* ═══════════════════════ diálogos ═══════════════════════════════ */

  function modal({ title, description, body, footer, wide }) {
    const scrim = el("div", { class: "modal-scrim", onclick: (event) => { if (event.target === scrim) dismiss(); } });
    const panel = el("div", { class: "modal" + (wide ? " modal-wide" : ""), role: "dialog", "aria-modal": "true", "aria-label": title });

    panel.append(
      el("header", { class: "modal-head" }, [
        el("div", { style: "flex:1;min-width:0" }, [
          el("h2", { text: title }),
          description ? el("p", { text: description }) : null,
        ]),
        el("button", { class: "icon-btn", "aria-label": "Fechar", onclick: () => dismiss(),
          html: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">${ICON.close}</svg>` }),
      ]),
      el("div", { class: "modal-body" }, body),
    );
    if (footer) panel.append(el("footer", { class: "modal-foot" }, footer));

    scrim.append(panel);
    const dismiss = mountOverlay(scrim);

    requestAnimationFrame(() => {
      const first = panel.querySelector("input, textarea");
      if (first) first.focus();
    });

    return dismiss;
  }

  function openBoardDialog(board) {
    const editing = Boolean(board);
    let emoji = board ? board.emoji : BOARD_EMOJIS[0];
    let color = board ? board.color : BOARD_COLORS[0];
    let confirming = false;

    const name = el("input", { class: "text-input", placeholder: "Ex.: Landing pages que convertem" });
    name.value = board ? board.name : "";
    const description = el("textarea", { class: "textarea", rows: "2", placeholder: "Pra que serve esse board?" });
    description.value = board ? board.description || "" : "";

    const emojiBox = el("div", { class: "emojis" });
    const colorBox = el("div", { class: "swatches" });

    const paintPickers = () => {
      emojiBox.replaceChildren(...BOARD_EMOJIS.map((option) =>
        el("button", { class: "emoji", text: option, "aria-pressed": option === emoji ? "true" : "false",
          onclick: () => { emoji = option; paintPickers(); } })));
      colorBox.replaceChildren(...BOARD_COLORS.map((option) =>
        el("button", { class: "swatch", style: "background:" + option, "aria-label": "Cor " + option,
          "aria-pressed": option === color ? "true" : "false",
          onclick: () => { color = option; paintPickers(); } })));
    };
    paintPickers();

    const save = async () => {
      const value = name.value.trim();
      if (!value) return;
      const payload = { name: value, emoji, color, description: description.value.trim() };
      if (editing) { await updateBoard(board.id, payload); toast("Board atualizado", { tone: "success" }); }
      else {
        const created = await createBoard(payload);
        select({ type: "board", id: created.id });
        toast(`Board “${created.name}” criado`, { tone: "success" });
      }
      dismiss(); renderRail(); renderHead(); renderGrid();
    };

    name.addEventListener("keydown", (event) => { if (event.key === "Enter") save(); });

    const deleteButton = editing
      ? el("button", { class: "btn btn-danger left", text: "Excluir board", onclick: async (event) => {
          if (!confirming) {
            confirming = true;
            const count = state.items.filter((i) => i.boardIds.includes(board.id)).length;
            event.currentTarget.textContent = count
              ? `Confirmar exclusão (${count} itens ficam soltos)` : "Confirmar exclusão";
            return;
          }
          await deleteBoard(board.id);
          if (selectionKey(state.selection) === "board:" + board.id) state.selection = { type: "todos" };
          dismiss(); renderRail(); renderHead(); renderGrid();
          toast("Board excluído — as referências continuam salvas");
        } })
      : null;

    const dismiss = modal({
      title: editing ? "Editar board" : "Novo board",
      description: editing
        ? "Excluir o board não apaga as referências — elas voltam para “Sem board”."
        : "Boards agrupam referências por assunto. Uma referência pode estar em vários.",
      body: [
        el("div", {}, [el("span", { class: "field-label", text: "Nome" }), name]),
        el("div", {}, [el("span", { class: "field-label", text: "Descrição (opcional)" }), description]),
        el("div", {}, [el("span", { class: "field-label", text: "Ícone" }), emojiBox]),
        el("div", {}, [el("span", { class: "field-label", text: "Cor" }), colorBox]),
      ],
      footer: [
        deleteButton,
        el("button", { class: "btn btn-ghost", text: "Cancelar", onclick: () => dismiss() }),
        el("button", { class: "btn btn-primary", text: editing ? "Salvar" : "Criar board", onclick: save }),
      ].filter(Boolean),
    });
  }

  function openShortcuts() {
    const groups = [
      ["Em qualquer lugar", [
        [modKey() + "K", "Busca rápida de tudo"], ["A", "Focar a barra de captura"],
        ["/", "Focar o filtro da lista atual"], ["B", "Criar um board"],
        ["T", "Alternar tema"], ["?", "Este quadro de atalhos"],
      ]],
      ["Navegando pelas referências", [
        ["← ↑ ↓ →", "Mover o foco entre os cards"], ["J / K", "Próxima / anterior"],
        ["Enter", "Abrir o painel de detalhe"], ["O", "Abrir o link original"],
        ["F", "Favoritar"], ["Delete", "Excluir (com desfazer)"], ["Esc", "Fechar o que estiver aberto"],
      ]],
      ["Capturando", [
        ["Enter", "Salvar o que está na barra"], ["Shift Enter", "Quebrar linha na nota"],
        [modKey() + "V", "Colar link ou print direto na página"], ["Arrastar", "Soltar imagens na janela"],
      ]],
    ];

    modal({
      title: "Atalhos do teclado",
      description: "A ideia é nunca precisar do mouse pra capturar ou achar algo.",
      wide: true,
      body: [el("div", { class: "shortcut-grid" }, groups.map(([title, rows], index) =>
        el("section", { class: index === 2 ? "full" : "" }, [
          el("h3", { text: title }),
          el("dl", {}, rows.map(([keys, label]) =>
            el("div", {}, [
              el("dt", {}, [el("kbd", { text: keys })]),
              el("dd", { text: label }),
            ]))),
        ])))],
    });
  }

  function openSettings() {
    let confirming = false;

    const exportButton = el("button", { class: "btn btn-primary", onclick: doExport },
      [svg(ICON.download, 14), "Exportar tudo"]);
    const fileInput = el("input", { type: "file", accept: "application/json,.json", hidden: true });
    fileInput.addEventListener("change", () => doImport(fileInput.files[0]));

    async function doExport() {
      const payload = {
        format: "referencias/backup", version: 1, exportedAt: new Date().toISOString(),
        boards: state.boards,
        items: await Promise.all(state.items.map(async ({ imageBlob, ...rest }) => Object.assign({}, rest, {
          imageData: imageBlob ? await blobToDataUrl(imageBlob) : undefined,
        }))),
      };
      const json = JSON.stringify(payload, null, 2);
      const filename = `referencias-${new Date().toISOString().slice(0, 10)}.json`;

      if (window.claude && window.claude.downloads) {
        try {
          await window.claude.downloads.save({ filename, data: json });
          toast(`Backup gerado (${formatBytes(new Blob([json]).size)})`, { tone: "success" });
        } catch (error) {
          if (error && error.code === "declined") return;
          toast("Não consegui salvar o arquivo agora", { tone: "error" });
        }
        return;
      }

      const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      const anchor = el("a", { href: url, download: filename });
      document.body.append(anchor); anchor.click(); anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast(`Backup gerado (${formatBytes(new Blob([json]).size)})`, { tone: "success" });
    }

    async function doImport(file) {
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        if (parsed.format !== "referencias/backup" || !Array.isArray(parsed.items)) {
          throw new Error("Arquivo não parece um backup de Referências");
        }

        const boards = (parsed.boards || []).filter((b) => b && b.id && b.name);
        const items = [];
        for (const raw of parsed.items) {
          if (!raw || !raw.id) continue;
          const { imageData, ...rest } = raw;
          items.push(Object.assign({}, rest, {
            tags: Array.isArray(rest.tags) ? rest.tags : [],
            boardIds: Array.isArray(rest.boardIds) ? rest.boardIds : [],
            imageBlob: imageData ? await (await fetch(imageData)).blob() : undefined,
          }));
        }

        await dbPutMany(S_BOARDS, boards);
        await dbPutMany(S_ITEMS, items);

        const boardMap = new Map(state.boards.map((b) => [b.id, b]));
        boards.forEach((b) => boardMap.set(b.id, b));
        const itemMap = new Map(state.items.map((i) => [i.id, i]));
        items.forEach((i) => { releaseCover(i.id); itemMap.set(i.id, i); });

        state.boards = [...boardMap.values()]; sortBoards();
        state.items = [...itemMap.values()];
        state.selection = { type: "todos" };

        renderRail(); renderHead(); renderGrid();
        toast(`${items.length} referências e ${boards.length} boards importados`, { tone: "success" });
      } catch (error) {
        toast(error.message || "Arquivo de backup inválido", { tone: "error" });
      } finally {
        fileInput.value = "";
      }
    }

    const dismiss = modal({
      title: "Ajustes e backup",
      description: "Exporte de tempos em tempos — é a sua cópia, fora de qualquer serviço.",
      body: [
        el("div", { class: "stat-strip" }, [
          el("div", { class: "stat" }, [
            el("b", { text: String(state.items.length) }),
            el("span", { text: state.items.length === 1 ? "referência" : "referências" }),
          ]),
          el("div", { class: "stat-divider" }),
          el("div", { class: "stat" }, [
            el("b", { text: String(state.boards.length) }),
            el("span", { text: state.boards.length === 1 ? "board" : "boards" }),
          ]),
          el("div", { class: "stat-divider" }),
          el("div", { class: "stat" }, [
            el("b", { text: String(new Set(state.items.flatMap((i) => i.tags)).size) }),
            el("span", { text: "tags" }),
          ]),
        ]),

        el("section", { class: "section" }, [
          el("h3", { text: "Backup" }),
          el("p", { text: "Limpar os dados do navegador apaga o acervo, e o arquivo é o que traz tudo de volta — inclusive as imagens." }),
          el("div", { class: "row-actions" }, [
            exportButton, fileInput,
            el("button", { class: "btn btn-ghost", onclick: () => fileInput.click() },
              [svg(ICON.upload, 14), "Importar backup"]),
          ]),
          el("p", { class: "fine", text: "O import soma ao que já existe. Reimportar o mesmo arquivo não duplica nada." }),
        ]),

        el("section", { class: "section" }, [
          el("h3", { text: "Zona de risco" }),
          el("p", { text: "Apaga todas as referências e boards deste navegador. Não dá pra desfazer." }),
          el("div", { class: "row-actions" }, [
            el("button", { class: "btn btn-danger", text: "Limpar acervo", onclick: async (event) => {
              if (!confirming) {
                confirming = true;
                event.currentTarget.textContent = `Confirmar: apagar ${state.items.length} itens`;
                return;
              }
              state.items.forEach((item) => releaseCover(item.id));
              await Promise.all([dbClear(S_ITEMS), dbClear(S_BOARDS)]);
              state.items = []; state.boards = []; state.selection = { type: "todos" };
              dismiss(); renderRail(); renderHead(); renderGrid();
              toast("Acervo limpo", { tone: "success" });
            } }),
          ]),
        ]),
      ],
      footer: [el("button", { class: "btn btn-ghost", text: "Fechar", onclick: () => dismiss() })],

  }

  const blobToDataUrl = (blob) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });

  /* ═══════════════════════════ ações ══════════════════════════════ */

  function select(selection) {
    state.selection = selection;
    state.focusedId = null;
    state.railOpen = false;
    $("rail").dataset.open = "false";
    if (state.detailId) closeDetail();

    $("scroller").scrollTop = 0;

  function clearFilters() {
    state.query = "";
    $("filter-input").value = "";

  async function toggleFavorite(id) {

    if (!item) return;

    const snapshot = Object.assign({}, item);
    await deleteItem(item.id);

    renderRail(); renderGrid();
    toast(`“${item.title.slice(0, 40)}” excluída`, {

  function focusCapture() {

    input.focus();
    input.scrollIntoView({ block: "nearest", behavior: "smooth" });

  /* ═════════════════════════ captura ══════════════════════════════ */

  function titleFromUrl(url) {
    try {
      const parsed = new URL(url);
      const slug = parsed.pathname.split("/").filter(Boolean).pop();
      if (slug) {
        const cleaned = decodeURIComponent(slug)
          .replace(/\.\w{2,5}$/, "").replace(/[-_]+/g, " ").trim();
        if (cleaned) return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
      }
      return parsed.hostname.replace(/^www\./, "");
    } catch { return url; }
  }

  function targetBoards() {
    const value = $("board-select").value;
    return value ? [value] : [];
  }

  async function saveLinks(urls, boardIds) {
    const normalized = [...new Set(urls.map(normalizeUrl).filter(Boolean))];
    if (!normalized.length) throw new Error("Nenhuma URL válida no que você colou");

    return createItems(normalized.map((url) => {
      const title = titleFromUrl(url);
      return {
        kind: "link", title, url, siteName: hostOf(url),
        boardIds, tags: suggestTags({ url, title }),
      };
    }));
  }

  async function saveNote(text, boardIds) {
    const trimmed = text.trim();
    if (!trimmed) throw new Error("A nota está vazia");
    const [first, ...rest] = trimmed.split("\n");
    const title = first.length > 90 ? first.slice(0, 88).trimEnd() + "…" : first;
    const body = rest.join("\n").trim() || (first.length > 90 ? trimmed : undefined);
    return createItem({ kind: "note", title, description: body, boardIds, tags: suggestTags({ title, description: body }, 3) });
  }

  function compressImage(file, maxSize = 1600, quality = 0.82) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(image.width, image.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        const ratio = image.width / image.height || 1;
        URL.revokeObjectURL(url);
        canvas.toBlob((blob) => resolve({ blob: blob || file, ratio }), "image/webp", quality);
      };
      image.onerror = () => { URL.revokeObjectURL(url); resolve({ blob: file, ratio: 1 }); };
      image.src = url;
    });
  }

  async function saveImages(files, boardIds) {
    const images = files.filter((file) => /^image\//.test(file.type));
    if (!images.length) throw new Error("Nenhuma imagem reconhecida no arquivo");

    const drafts = [];
    for (const file of images) {
      const isVector = file.type === "image/svg+xml";
      const { blob, ratio } = isVector ? { blob: file, ratio: 1 } : await compressImage(file);
      const title = (file.name || "").replace(/\.\w+$/, "").replace(/[-_]+/g, " ").trim();
      drafts.push({
        kind: "image", title: title || "Imagem sem nome",
        imageBlob: blob, imageRatio: ratio, boardIds, tags: suggestTags({ title }, 3),
      });
    }
    return createItems(drafts);
  }

  let firstLinkHintShown = false;

  async function submitCapture() {
    const input = $("capture-input");
    const text = input.value.trim();
    if (!text) return;

    const urls = extractUrls(text);
    // O campo esvazia na hora e segue habilitado: já dá pra colar o próximo.
    input.value = "";
    growCapture();
    updateCaptureMode();

    try {
      if (urls.length) {
        const saved = await saveLinks(urls, targetBoards());
        state.focusedId = saved[0].id;
        toast(saved.length > 1 ? `${saved.length} links salvos` : `“${saved[0].title.slice(0, 42)}” salvo`,
          { tone: "success" });
        if (!firstLinkHintShown) {
          firstLinkHintShown = true;
          setTimeout(() => toast("Nesta demo o título vem da URL — clique no card pra editar", {
            action: { label: "Entender", run: openAbout },
          }), 900);
        }
      } else {
        const saved = await saveNote(text, targetBoards());
        state.focusedId = saved.id;
        toast("Nota salva", { tone: "success" });
      }
      renderRail(); renderHead(); renderGrid();
    } catch (error) {
      if (!input.value) { input.value = text; growCapture(); updateCaptureMode(); }
      toast(error.message || "Não consegui salvar", { tone: "error" });
    }
  }

  async function handleFiles(files) {
    try {
      const saved = await saveImages([...files], targetBoards());
      state.focusedId = saved[0].id;
      renderRail(); renderGrid();
      toast(saved.length > 1 ? `${saved.length} imagens salvas` : "Imagem salva", { tone: "success" });
    } catch (error) {
      toast(error.message || "Não consegui salvar", { tone: "error" });
    }
  }

  function growCapture() {
    const input = $("capture-input");
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 168) + "px";
  }

  function updateCaptureMode() {
    const input = $("capture-input");
    const value = input.value.trim();
    const urls = extractUrls(value);
    const mode = !value ? "empty" : urls.length ? "link" : "note";

    const icon = $("capture-icon");
    icon.dataset.mode = mode;
    icon.innerHTML =
      `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${
        mode === "link" ? ICON.link : mode === "note" ? ICON.note : ICON.plus}</svg>`;

    const button = $("save-btn");
    button.disabled = mode === "empty";
    button.replaceChildren(
      document.createTextNode(urls.length > 1 ? `Salvar ${urls.length}` : "Salvar"),
      el("kbd", { text: "↵", style: "border-color:currentColor;opacity:.7" }),
    );
  }

  /* ═════════════════════════ tema ═════════════════════════════════ */

  const prefersDark = () => window.matchMedia("(prefers-color-scheme: dark)").matches;
  const resolvedTheme = () => state.theme || (prefersDark() ? "dark" : "light");

  function applyTheme() {
    document.documentElement.dataset.theme = resolvedTheme();
  }

  function toggleTheme() {
    state.theme = resolvedTheme() === "dark" ? "light" : "dark";
    applyTheme();
    // Espelhado no localStorage porque o script do <head> precisa do tema
    // antes da primeira pintura, e o IndexedDB só responde depois.
    try { localStorage.setItem("referencias:theme", state.theme); } catch (e) {}
    persistPrefs();
    renderHead();
  }

  /* ═════════════════════ navegação por teclado ════════════════════ */

  const isTyping = (target) =>
    target instanceof HTMLElement &&
    (["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName) || target.isContentEditable);

  const modKey = () => (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? "⌘" : "Ctrl ");

  function moveFocus(direction) {
    const items = visibleItems();
    if (!items.length) return;

    const currentIndex = state.focusedId ? items.findIndex((i) => i.id === state.focusedId) : -1;

    if (direction === "next" || direction === "previous") {
      const delta = direction === "next" ? 1 : -1;
      const next = currentIndex === -1 ? 0
        : Math.min(Math.max(currentIndex + delta, 0), items.length - 1);
      setFocus(items[next].id);
      return;
    }

    const nodes = [...$("grid").querySelectorAll("[data-item-id]")];
    if (!nodes.length) return;
    if (currentIndex === -1) { setFocus(items[0].id); return; }

    const currentNode = nodes.find((node) => node.dataset.itemId === state.focusedId);
    if (!currentNode) return;

    // Geometria em vez de índice: no mural as colunas têm alturas diferentes,
    // então "o de baixo" não é simplesmente index + número de colunas.
    const origin = currentNode.getBoundingClientRect();
    const horizontal = direction === "left" || direction === "right";
    const sign = direction === "right" || direction === "down" ? 1 : -1;

    let best = null;
    for (const node of nodes) {
      const id = node.dataset.itemId;
      if (!id || id === state.focusedId) continue;
      const rect = node.getBoundingClientRect();
      const main = horizontal ? rect.left - origin.left : rect.top - origin.top;
      if (main * sign <= 1) continue;
      const cross = horizontal ? Math.abs(rect.top - origin.top) : Math.abs(rect.left - origin.left);
      const cost = Math.abs(main) + cross * 2.5;
      if (!best || cost < best.cost) best = { id, cost };
    }
    if (best) setFocus(best.id);
  }

  function setFocus(id) {
    const previous = $("grid").querySelector('[data-focused="true"]');
    if (previous) previous.dataset.focused = "false";
    state.focusedId = id;
    const node = $("grid").querySelector(`[data-item-id="${CSS.escape(id)}"]`);
    if (node) { node.dataset.focused = "true"; node.scrollIntoView({ block: "nearest" }); }
  }

  function onKeyDown(event) {
    const mod = event.metaKey || event.ctrlKey;

    if (mod && event.key.toLowerCase() === "k") {
      event.preventDefault();
      openPalette();
      return;
    }

    if (isTyping(event.target) || mod || event.altKey) {
      // Esc dentro de um campo da gaveta fecha mesmo assim — o blur roda antes,
      // então o que estava sendo escrito é salvo em vez de sumir.
      if (event.key === "Escape" && isTyping(event.target) && state.detailId
          && event.target.closest(".drawer")) {
        event.target.blur();
        closeDetail();
      }
      return;
    }

    if (event.key === "Escape") {
      if (closeTopOverlay()) return;
      if (state.focusedId) { setFocus(null); state.focusedId = null; }
      return;
    }

    if (overlayStack.length) return;

    switch (event.key) {
      case "a": event.preventDefault(); focusCapture(); return;
      case "/": event.preventDefault(); $("filter-input").focus(); return;
      case "b": event.preventDefault(); openBoardDialog(null); return;
      case "t": event.preventDefault(); toggleTheme(); return;
      case "?": event.preventDefault(); openShortcuts(); return;
      case "ArrowDown": event.preventDefault(); moveFocus("down"); return;
      case "ArrowUp": event.preventDefault(); moveFocus("up"); return;
      case "ArrowLeft": event.preventDefault(); moveFocus("left"); return;
      case "ArrowRight": event.preventDefault(); moveFocus("right"); return;
      case "j": event.preventDefault(); moveFocus("next"); return;
      case "k": event.preventDefault(); moveFocus("previous"); return;
    }

    const target = state.items.find((i) => i.id === state.focusedId);
    if (!target) return;

    if (event.key === "Enter") { event.preventDefault(); openDetail(target.id); }
    else if (event.key === "o") { event.preventDefault(); openSource(target); }
    else if (event.key === "f") { event.preventDefault(); toggleFavorite(target.id); }
    else if (event.key === "Delete" || event.key === "Backspace") {
      event.preventDefault(); removeItem(target);
    }
  }

  function onDetailKeyDown(event) {
    if (!state.detailId || overlayStack.length > 1) return;
    if (isTyping(event.target) || event.metaKey || event.ctrlKey) return;

    const list = visibleItems();
    const index = list.findIndex((i) => i.id === state.detailId);
    if (event.key === "j" && index < list.length - 1) { event.preventDefault(); openDetail(list[index + 1].id); }
    else if (event.key === "k" && index > 0) { event.preventDefault(); openDetail(list[index - 1].id); }
  }

  /* ═══════════════════════ colar e arrastar ═══════════════════════ */

  let dragDepth = 0;
  let dropzone = null;

  function showDropzone(show) {
    if (show && !dropzone) {
      dropzone = el("div", { class: "dropzone" }, [
        el("div", {}, [
          svg(ICON.image, 30),
          el("p", { text: "Solte para salvar no acervo" }),
        ]),
      ]);
      document.body.append(dropzone);
    } else if (!show && dropzone) {
      dropzone.remove();
      dropzone = null;
    }
  }

  /* ═══════════════════════════ arranque ═══════════════════════════ */

  async function load() {
    try {
      const [boards, items, prefs] = await Promise.all([
        dbAll(S_BOARDS), dbAll(S_ITEMS), dbGet(S_PREFS, "app"),
      ]);

      if (prefs) {
        state.view = prefs.view || state.view;
        state.sort = prefs.sort || state.sort;
        state.theme = prefs.theme || null;
      }
      applyTheme();

      if (!boards.length && !items.length && !(prefs && prefs.onboarded)) {
        const seed = await buildSeed();
        await dbPutMany(S_BOARDS, seed.boards);
        await dbPutMany(S_ITEMS, seed.items);
        await dbPut(S_PREFS, { view: state.view, sort: state.sort, theme: state.theme, onboarded: true }, "app");
        state.boards = seed.boards;
        state.items = seed.items;
      } else {
        state.boards = boards; sortBoards();
        state.items = items;
      }
    } catch (error) {
      console.error("Banco local indisponível", error);
      toast("Não consegui abrir o banco local; esta sessão não vai salvar", { tone: "error" });
    }

    state.ready = true;
    renderRail(); renderHead(); renderGrid();
  }

  function wire() {
    const captureInput = $("capture-input");
    captureInput.addEventListener("input", () => { growCapture(); updateCaptureMode(); });
    captureInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); submitCapture(); }
      else if (event.key === "Escape") { captureInput.value = ""; growCapture(); updateCaptureMode(); captureInput.blur(); }
    });
    $("save-btn").addEventListener("click", submitCapture);
    $("upload-btn").addEventListener("click", () => $("file-input").click());
    $("file-input").addEventListener("change", (event) => {
      handleFiles(event.target.files);
      event.target.value = "";
    });

    let filterTimer = null;
    $("filter-input").addEventListener("input", (event) => {
      const value = event.target.value;
      clearTimeout(filterTimer);
      filterTimer = setTimeout(() => {
        state.query = value;
        state.focusedId = null;
        $("filter-clear").classList.toggle("hidden", !value);
        renderGrid();
      }, 130);
    });
    $("filter-input").addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.target.value = ""; state.query = "";
        $("filter-clear").classList.add("hidden");
        renderGrid(); event.target.blur();
      }
    });
    $("filter-clear").addEventListener("click", () => {
      $("filter-input").value = ""; state.query = "";
      $("filter-clear").classList.add("hidden");
      renderGrid(); $("filter-input").focus();
    });

    $("sort-select").addEventListener("change", (event) => {
      state.sort = event.target.value;
      persistPrefs();
      renderGrid();
    });

    $("palette-btn").addEventListener("click", openPalette);
    $("theme-btn").addEventListener("click", toggleTheme);
    $("shortcuts-btn").addEventListener("click", openShortcuts);
    $("settings-btn").addEventListener("click", openSettings);
    $("about-btn").addEventListener("click", openAbout);
    $("rail-open").addEventListener("click", () => { $("rail").dataset.open = "true"; });
    $("rail-close").addEventListener("click", () => { $("rail").dataset.open = "false"; });

    $("palette-kbd").textContent = modKey() + "K";

    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keydown", onDetailKeyDown);

    window.addEventListener("paste", async (event) => {
      if (isTyping(event.target) || overlayStack.length) return;

      const files = [...(event.clipboardData ? event.clipboardData.files : [])];
      if (files.length) { event.preventDefault(); await handleFiles(files); return; }

      const text = event.clipboardData && event.clipboardData.getData("text/plain");
      if (!text) return;
      const trimmed = text.trim();
      const looksLikeUrl = /^https?:\/\//i.test(trimmed) ||
        /^[\w-]+(\.[\w-]+)+([/?#].*)?$/.test(trimmed);
      if (!looksLikeUrl || /\s/.test(trimmed)) return;

      event.preventDefault();
      try {
        const saved = await saveLinks(extractUrls(trimmed), targetBoards());
        state.focusedId = saved[0].id;
        renderRail(); renderGrid();
        toast(`“${saved[0].title.slice(0, 42)}” salvo`, { tone: "success" });
      } catch {
        toast("Não consegui salvar esse link", { tone: "error" });
      }
    });

    window.addEventListener("dragenter", (event) => {
      if (!event.dataTransfer || ![...event.dataTransfer.types].includes("Files")) return;
      dragDepth += 1;
      showDropzone(true);
    });
    window.addEventListener("dragover", (event) => {
      if (event.dataTransfer && [...event.dataTransfer.types].includes("Files")) event.preventDefault();
    });
    window.addEventListener("dragleave", () => {
      // dragleave dispara ao cruzar cada filho; o contador evita o overlay piscar
      dragDepth = Math.max(0, dragDepth - 1);
      if (!dragDepth) showDropzone(false);
    });
    window.addEventListener("drop", async (event) => {
      if (!event.dataTransfer || ![...event.dataTransfer.types].includes("Files")) return;
      event.preventDefault();
      dragDepth = 0;
      showDropzone(false);
      const files = [...event.dataTransfer.files];
      if (files.length) await handleFiles(files);
    });

    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (!state.theme) { applyTheme(); renderHead(); }
    });

    // O visualizador também carimba data-theme na raiz; seguimos o que ele definir.
    new MutationObserver(() => {
      const stamped = document.documentElement.dataset.theme;
      if (stamped && stamped !== resolvedTheme()) { state.theme = stamped; renderHead(); }
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

    growCapture();
    updateCaptureMode();
  }

  applyTheme();
  wire();
  renderGrid();
  load();
})();
</script>

</body>
</html>
