<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Referências — seu banco pessoal de ideias</title>
<meta name="description" content="Espaço pessoal de referências: capture links, imagens e ideias em segundos e encontre a certa na hora em que você estiver criando alguma coisa.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d97757'/%3E%3Cpath d='M16 6.5l2.3 5.9 5.9 2.3-5.9 2.3L16 22.9l-2.3-5.9-5.9-2.3 5.9-2.3z' fill='%23fff'/%3E%3Ccircle cx='23.5' cy='23.5' r='2.3' fill='%23fff' opacity='.85'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d97757'/%3E%3Cpath d='M16 6.5l2.3 5.9 5.9 2.3-5.9 2.3L16 22.9l-2.3-5.9-5.9-2.3 5.9-2.3z' fill='%23fff'/%3E%3Ccircle cx='23.5' cy='23.5' r='2.3' fill='%23fff' opacity='.85'/%3E%3C/svg%3E">

<meta property="og:type" content="website">
<meta property="og:title" content="Referências — seu banco pessoal de ideias">
<meta property="og:description" content="Espaço pessoal de referências: capture links, imagens e ideias em segundos e encontre a certa na hora em que você estiver criando alguma coisa.">
<meta name="twitter:card" content="summary">

<script>
  // Aplica o tema salvo antes da primeira pintura. Sem isto, quem usa o tema
  // escuro vê um lampejo claro a cada carregamento — a preferência só é lida
  // do IndexedDB depois, e o IndexedDB é assíncrono.
  (function () {
    try {
      var saved = localStorage.getItem("referencias:theme");
      var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    } catch (e) {}
  })();
</script>
</head>
<body>

<style>
  /* ──────────────────────────────────────────────────────────────────
     Tokens. Claro é o padrão; o escuro entra pela preferência do sistema
     e os dois são reafirmados por [data-theme] para que o botão de tema
     (o desta página ou o do visualizador) vença a media query nos dois
     sentidos.
     ────────────────────────────────────────────────────────────────── */
  :root {
    --bg: #faf9f7;
    --bg-elevated: #ffffff;
    --bg-sunken: #f1efeb;
    --surface: #ffffff;
    --surface-hover: #f5f3f0;
    --border: #e6e2dc;
    --border-strong: #d3cec6;
    --text: #1b1b1d;
    --text-muted: #6b6862;
    --text-faint: #96928a;
    --accent: #c2593a;
    --accent-soft: #f8e7e0;
    --accent-text: #a8462b;
    --good: #2f7d5b;
    --warn: #a8720f;
    --bad: #b4342a;
    --overlay: rgb(28 25 23 / 0.45);
    --shadow-panel: 0 1px 2px rgb(28 25 23 / 0.06), 0 24px 48px -24px rgb(28 25 23 / 0.28);
    --chip-cover: rgb(255 255 255 / 0.92);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0d;
      --bg-elevated: #121215;
      --bg-sunken: #08080a;
      --surface: #17171b;
      --surface-hover: #1e1e23;
      --border: #26262d;
      --border-strong: #35353f;
      --text: #f2f2f3;
      --text-muted: #9b9ba5;
      --text-faint: #67676f;
      --accent: #d97757;
      --accent-soft: #3a231b;
      --accent-text: #f0a184;
      --good: #4ea87b;
      --warn: #d9a441;
      --bad: #e2695c;
      --overlay: rgb(0 0 0 / 0.55);
      --shadow-panel: 0 1px 2px rgb(0 0 0 / 0.4), 0 24px 48px -24px rgb(0 0 0 / 0.7);
      --chip-cover: rgb(10 10 12 / 0.72);
    }
  }

  :root[data-theme="light"] {
    --bg: #faf9f7;
    --bg-elevated: #ffffff;
    --bg-sunken: #f1efeb;
    --surface: #ffffff;
    --surface-hover: #f5f3f0;
    --border: #e6e2dc;
    --border-strong: #d3cec6;
    --text: #1b1b1d;
    --text-muted: #6b6862;
    --text-faint: #96928a;
    --accent: #c2593a;
    --accent-soft: #f8e7e0;
    --accent-text: #a8462b;
    --good: #2f7d5b;
    --warn: #a8720f;
    --bad: #b4342a;
    --overlay: rgb(28 25 23 / 0.45);
    --shadow-panel: 0 1px 2px rgb(28 25 23 / 0.06), 0 24px 48px -24px rgb(28 25 23 / 0.28);
    --chip-cover: rgb(255 255 255 / 0.92);
  }

  :root[data-theme="dark"] {
    --bg: #0b0b0d;
    --bg-elevated: #121215;
    --bg-sunken: #08080a;
    --surface: #17171b;
    --surface-hover: #1e1e23;
    --border: #26262d;
    --border-strong: #35353f;
    --text: #f2f2f3;
    --text-muted: #9b9ba5;
    --text-faint: #67676f;
    --accent: #d97757;
    --accent-soft: #3a231b;
    --accent-text: #f0a184;
    --good: #4ea87b;
    --warn: #d9a441;
    --bad: #e2695c;
    --overlay: rgb(0 0 0 / 0.55);
    --shadow-panel: 0 1px 2px rgb(0 0 0 / 0.4), 0 24px 48px -24px rgb(0 0 0 / 0.7);
    --chip-cover: rgb(10 10 12 / 0.72);
  }

  :root {
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light dark;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    overscroll-behavior: none;
  }

  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  ::selection { background: var(--accent); color: #fff; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border: 3px solid transparent;
    border-radius: 999px;
    background-clip: content-box;
  }

  /* ── esqueleto ──────────────────────────────────────────────────── */

  .app { display: flex; height: 100dvh; }

  .rail {
    width: 17rem;
    flex: 0 0 17rem;
    display: flex;
    flex-direction: column;
    background: var(--bg-elevated);
    border-right: 1px solid var(--border);
    z-index: 30;
  }

  .rail-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 16px 12px;
  }
  .mark {
    width: 28px; height: 28px;
    flex: none;
    display: grid; place-items: center;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
  }
  .rail-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .rail-sub { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  .rail-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 12px; }

  .group-title {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 10px 6px;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-faint);
  }

  .nav-row { position: relative; }
  .nav {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-muted);
    text-align: left;
    transition: background 0.12s, color 0.12s;
  }
  .nav:hover { background: var(--surface-hover); color: var(--text); }
  .nav[aria-current="true"] {
    background: var(--surface-hover);
    color: var(--text);
    font-weight: 500;
  }
  .nav-icon { width: 16px; flex: none; display: grid; place-items: center; }
  .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-count {
    flex: none;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }

  .nav-edit {
    position: absolute; right: 6px; top: 50%;
    transform: translateY(-50%);
    padding: 4px; border-radius: 6px;
    color: var(--text-faint);
    background: var(--surface-hover);
    opacity: 0;
    transition: opacity 0.12s;
  }
  .nav-row:hover .nav-edit, .nav-edit:focus-visible { opacity: 1; }
  .nav-edit:hover { color: var(--text); }

  .rail-foot { border-top: 1px solid var(--border); padding: 6px 10px 8px; }
  .foot-row { display: flex; gap: 4px; }
  .foot-btn {
    flex: 1; padding: 8px; border-radius: 8px;
    display: grid; place-items: center;
    color: var(--text-faint);
    transition: background 0.12s, color 0.12s;
  }
  .foot-btn:hover { background: var(--surface-hover); color: var(--text); }

  .state-row {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 7px 10px; border-radius: 8px;
    font-size: 12px; color: var(--text-muted); text-align: left;
    transition: background 0.12s, color 0.12s;
  }
  .state-row:hover { background: var(--surface-hover); color: var(--text); }
  .dot { width: 6px; height: 6px; border-radius: 999px; flex: none; background: var(--good); }

  /* ── área principal ─────────────────────────────────────────────── */

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .head {
    flex: none;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    display: flex; flex-direction: column; gap: 10px;
  }

  .head-top { display: flex; align-items: center; gap: 12px; }
  .head-titles { flex: 1; min-width: 0; }
  .head-title {
    margin: 0;
    font-size: 17px; font-weight: 600; letter-spacing: -0.015em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .head-desc {
    font-size: 12px; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .search-open {
    display: flex; align-items: center; gap: 8px;
    flex: none;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-sunken);
    font-size: 12px;
    color: var(--text-faint);
    transition: border-color 0.12s, color 0.12s;
  }
  .search-open:hover { border-color: var(--border-strong); color: var(--text-muted); }

  kbd {
    font-family: var(--sans);
    font-size: 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 4px;
    color: inherit;
  }

  /* captura */
  .capture {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    transition: border-color 0.12s;
  }
  .capture:focus-within { border-color: var(--border-strong); }
  .capture-icon { margin: 6px 0 0 4px; flex: none; color: var(--text-faint); display: grid; }
  .capture-icon[data-mode="link"], .capture-icon[data-mode="note"] { color: var(--accent); }
  #capture-input {
    flex: 1; min-width: 0;
    margin-top: 4px;
    max-height: 168px;
    border: 0; background: none; outline: none; resize: none;
    font-size: 14px; line-height: 1.6;
  }
  #capture-input::placeholder { color: var(--text-faint); }
  .capture-actions { display: flex; align-items: center; gap: 6px; align-self: flex-end; flex: none; }

  .icon-btn {
    padding: 7px; border-radius: 8px; color: var(--text-faint);
    display: grid; place-items: center;
    transition: background 0.12s, color 0.12s;
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text); }

  select.control, .control {
    height: 34px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-sunken);
    color: var(--text-muted);
    font-size: 12px;
    transition: color 0.12s, border-color 0.12s;
  }
  select.control:hover, .control:hover { color: var(--text); }
  select.control { max-width: 11rem; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 12.5px; font-weight: 600;
    transition: opacity 0.12s, background 0.12s, color 0.12s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { background: var(--bg-sunken); color: var(--text-faint); cursor: not-allowed; opacity: 1; }
  .btn-ghost { border: 1px solid var(--border); color: var(--text-muted); font-weight: 500; }
  .btn-ghost:hover { background: var(--surface-hover); color: var(--text); }
  .btn-danger { border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); color: var(--bad); font-weight: 500; }
  .btn-danger:hover { background: color-mix(in srgb, var(--bad) 12%, transparent); }

  /* barra de filtros */
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-wrap { position: relative; flex: 1; min-width: 12rem; }
  .filter-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
  #filter-input {
    width: 100%; height: 34px;
    padding: 0 30px 0 32px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-sunken);
    outline: none;
    font-size: 13px;
    transition: border-color 0.12s;
  }
  #filter-input:focus { border-color: var(--border-strong); }
  #filter-input::placeholder { color: var(--text-faint); }
  #filter-input::-webkit-search-cancel-button { display: none; }
  .filter-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); padding: 4px; border-radius: 6px; color: var(--text-faint); }
  .filter-clear:hover { color: var(--text); }

  .chip {
    height: 34px; padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-sunken);
    font-size: 12px; font-weight: 500;
    color: var(--text-muted);
    transition: all 0.12s;
  }
  .chip:hover { color: var(--text); }
  .chip[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  .segmented {
    display: flex; align-items: center;
    height: 34px; padding: 2px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-sunken);
  }
  .seg {
    padding: 5px 8px; border-radius: 6px;
    color: var(--text-faint);
    display: grid; place-items: center;
    transition: all 0.12s;
  }
  .seg:hover { color: var(--text); }
  .seg[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }

  .count { margin-left: auto; font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  /* ── mural ──────────────────────────────────────────────────────── */

  .scroller { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 24px 40px; }

  .mural { column-gap: 16px; columns: 4; }
  .mural > * { break-inside: avoid; margin-bottom: 16px; }
  .grade { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
  .lista { display: flex; flex-direction: column; gap: 6px; }

  @media (max-width: 1600px) { .mural { columns: 4; } .grade { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 1280px) { .mural { columns: 3; } .grade { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 900px)  { .mural { columns: 2; } .grade { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px)  { .mural { columns: 1; } .grade { grid-template-columns: 1fr; } }

  .card {
    position: relative;
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.12s, background 0.12s;
  }
  .card:hover { border-color: var(--border-strong); background: var(--surface-hover); }
  .card[data-focused="true"] {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .grade .card { height: 100%; }

  .cover { position: relative; overflow: hidden; background: var(--bg-sunken); }
  .cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .cover-fallback { display: grid; place-items: center; }
  .cover-label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 0 16px;
    text-align: center;
  }

  .card-body { display: flex; flex-direction: column; gap: 6px; padding: 12px; flex: 1; min-height: 0; }
  .card-title {
    margin: 0;
    font-size: 13.5px; font-weight: 500; line-height: 1.35;
    text-wrap: pretty;
  }
  .card-note .card-title { font-size: 14.5px; letter-spacing: -0.01em; }
  .title-btn {
    display: block; width: 100%; text-align: left;
    outline: none;
    display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
    -webkit-line-clamp: 3;
  }
  .grade .title-btn { -webkit-line-clamp: 2; }
  /* área de clique do card inteiro, sem aninhar botão dentro de botão */
  .title-btn::before { content: ""; position: absolute; inset: 0; z-index: 1; }

  .card-excerpt {
    font-size: 12px; line-height: 1.55; color: var(--text-muted);
    white-space: pre-line;
    display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
    -webkit-line-clamp: 4;
  }
  .grade .card-excerpt { -webkit-line-clamp: 3; }

  .card-meta {
    margin-top: auto; padding-top: 2px;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-faint);
  }
  .card-meta .host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 10.5px; }
  .card-meta time { flex: none; }

  .tags { display: flex; flex-wrap: wrap; gap: 4px; position: relative; z-index: 2; }
  .tag {
    padding: 2px 6px;
    border-radius: 6px;
    background: var(--bg-sunken);
    font-size: 10.5px; font-weight: 500;
    color: var(--text-muted);
    transition: background 0.12s, color 0.12s;
  }
  .tag:hover { background: var(--accent-soft); color: var(--accent-text); }
  .tag-more { padding: 2px 2px; font-size: 10px; color: var(--text-faint); }

  .card-actions {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    display: flex; gap: 4px;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .card:hover .card-actions, .card:focus-within .card-actions { opacity: 1; }
  .act {
    padding: 6px; border-radius: 7px;
    background: var(--chip-cover);
    border: 1px solid var(--border);
    color: var(--text-muted);
    display: grid; place-items: center;
    backdrop-filter: blur(6px);
    transition: color 0.12s, background 0.12s;
  }
  .act:hover { color: var(--text); background: var(--surface); }
  .act[data-on="true"] { color: var(--accent); }

  .card-boards {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    display: flex; gap: 4px;
    opacity: 0; transition: opacity 0.12s;
  }
  .card:hover .card-boards { opacity: 1; }
  .board-chip {
    padding: 2px 6px; border-radius: 6px;
    background: var(--chip-cover);
    border: 1px solid var(--border);
    backdrop-filter: blur(6px);
    font-size: 10px; font-weight: 500;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .fav-mark {
    position: absolute; left: 8px; bottom: 8px; z-index: 2;
    padding: 4px; border-radius: 6px;
    background: var(--chip-cover);
    border: 1px solid var(--border);
    color: var(--accent);
    display: grid; place-items: center;
    backdrop-filter: blur(6px);
  }
  .card:hover .fav-mark { opacity: 0; }
  .card-note .fav-mark { position: static; border: 0; background: none; padding: 0; width: fit-content; }

  /* lista */
  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    position: relative;
    transition: border-color 0.12s, background 0.12s;
  }
  .row:hover { border-color: var(--border-strong); background: var(--surface-hover); }
  .row[data-focused="true"] {
    border-color: var(--accent);

  @media (prefers-reduced-motion: reduce) {

<script>
(() => {
  "use strict";

  /* ═══════════════════════════════ util ═══════════════════════════ */

  const $ = (id) => document.getElementById(id);

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (value === undefined || value === null || value === false) continue;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key === "html") node.innerHTML = value;
      else if (key === "style") node.setAttribute("style", value);
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else if (key === "dataset") Object.assign(node.dataset, value);
      else node.setAttribute(key, value === true ? "" : String(value));
    }
    for (const child of [].concat(children)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(typeof child === "string" ? document.createTextNode(child) : child);
    }
    return node;
  }

  const svg = (paths, size = 16) =>

  const deaccent = (v) => v.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  const slugifyTag = (raw) =>
    deaccent(raw).trim().replace(/[^a-z0-9\s-]/g, "").replace(/\s+/g, "-").replace(/-+/g, "-").slice(0, 32);

  function hostOf(url) {
    if (!url) return "";
    try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; }
  }

  function normalizeUrl(raw) {
    const trimmed = raw.trim();
    if (!trimmed) return null;
    const candidate = /^https?:\/\//i.test(trimmed) ? trimmed : "https://" + trimmed;
    try {
      const url = new URL(candidate);
      return url.hostname.includes(".") ? url.toString() : null;
    } catch { return null; }
  }

  function extractUrls(text) {
    const found = text.match(/https?:\/\/[^\s<>"')]+/gi);
    if (found && found.length) return found;
    return text.split(/[\n,]/).map((l) => l.trim())
      .filter((l) => /^[\w-]+(\.[\w-]+)+([/?#].*)?$/.test(l));
  }

  const RELATIVE = [
    [60000, 1000, "second"], [3600000, 60000, "minute"], [86400000, 3600000, "hour"],
    [604800000, 86400000, "day"], [2629800000, 604800000, "week"],
    [31557600000, 2629800000, "month"], [Infinity, 31557600000, "year"],
  ];

  function timeAgo(ts) {
    const delta = ts - Date.now();
    if (Math.abs(delta) < 45000) return "agora";
    const fmt = new Intl.RelativeTimeFormat("pt-BR", { numeric: "auto" });
    for (const [limit, div, unit] of RELATIVE) {
      if (Math.abs(delta) < limit) return fmt.format(Math.round(delta / div), unit);
    }
    return "";

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";
    const units = ["KB", "MB", "GB"];
    let value = bytes / 1024, i = 0;
    while (value >= 1024 && i < units.length - 1) { value /= 1024; i++; }
    return value.toFixed(value < 10 ? 1 : 0) + " " + units[i];
  }

  function colorFromString(value) {
    let hash = 0;

  /* ═════════════════════════ busca fuzzy ══════════════════════════ */

  const isBoundary = (text, i) => i === 0 || /[\s\-_/.:|]/.test(text[i - 1]);

  function fuzzy(query, target) {
    if (!query) return 0;
    const hay = deaccent(target || ""), needle = deaccent(query);
    if (!hay) return null;

    const direct = hay.indexOf(needle);
    if (direct !== -1) {
      let score = 120 - direct;
      if (direct === 0) score += 60; else if (isBoundary(hay, direct)) score += 30;
      return score;
    }

    let score = 0, cursor = 0, previous = -1;
    for (const char of needle) {
      if (char === " ") continue;
      const index = hay.indexOf(char, cursor);
      if (index === -1) return null;
      if (index === previous + 1) score += 8;
      if (isBoundary(hay, index)) score += 12;
      score += Math.max(0, 6 - (index - cursor));
      previous = index;
      cursor = index + 1;
    }
    return score + Math.max(0, 20 - hay.length / 6);
  }

  function searchItems(items, query) {
    const trimmed = query.trim();
    if (!trimmed) return items.slice();

    const scored = [];
    for (const item of items) {
      const title = fuzzy(trimmed, item.title);
      let score = title ? title * 3 : 0;
      for (const tag of item.tags) {
        const hit = fuzzy(trimmed, tag);
        if (hit) score = Math.max(score, hit * 2.4);
      }
      const host = hostOf(item.url);
      if (host) { const hit = fuzzy(trimmed, host); if (hit) score = Math.max(score, hit * 1.8); }
      const long = ((item.description || "") + " " + (item.notes || "")).trim();
      if (long && deaccent(long).includes(deaccent(trimmed))) score = Math.max(score, 70);
      if (score > 0) scored.push({ item, score });
    }
    return scored
      .sort((a, b) => b.score - a.score || b.item.updatedAt - a.item.updatedAt)
      .map((s) => s.item);
  }

  function suggestTags({ url, title, description }, limit = 5) {
    const tags = new Set();
    const host = hostOf(url);
    if (host) {
      for (const [domain, list] of Object.entries(DOMAIN_TAGS)) {
        if (host === domain || host.endsWith("." + domain)) list.forEach((t) => tags.add(t));
      }
    }
    const hay = deaccent([title, description].filter(Boolean).join(" "));
    for (const [pattern, tag] of KEYWORD_TAGS) {
      if (tags.size >= limit) break;
      if (pattern.test(hay)) tags.add(tag);
    }
    if (tags.size === 0 && host) {
      const root = host.split(".").slice(-2)[0];
      if (root) tags.add(slugifyTag(root));
    }
    return [...tags].slice(0, limit);
  }

  const DB_NAME = "referencias-demo";
  const S_ITEMS = "items", S_BOARDS = "boards", S_PREFS = "prefs";
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(S_ITEMS)) db.createObjectStore(S_ITEMS, { keyPath: "id" });
        if (!db.objectStoreNames.contains(S_BOARDS)) db.createObjectStore(S_BOARDS, { keyPath: "id" });
        if (!db.objectStoreNames.contains(S_PREFS)) db.createObjectStore(S_PREFS);
      };
      request.onsuccess = () => { request.result.onversionchange = () => request.result.close(); resolve(request.result); };
      request.onerror = () => reject(request.error);
    });
    return dbPromise;
  }

  const wrap = (request) => new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });

  async function dbAll(store) {
    const db = await openDB();
    return wrap(db.transaction(store, "readonly").objectStore(store).getAll());
  }
  async function dbPut(store, value, key) {
    const db = await openDB();
    const os = db.transaction(store, "readwrite").objectStore(store);
    return wrap(key === undefined ? os.put(value) : os.put(value, key));
  }
  async function dbPutMany(store, values) {
    if (!values.length) return;
    const db = await openDB();
    const tx = db.transaction(store, "readwrite");
    values.forEach((v) => tx.objectStore(store).put(v));
    return new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); });
  }
  async function dbDelete(store, key) {
    const db = await openDB();
    return wrap(db.transaction(store, "readwrite").objectStore(store).delete(key));
  }
  async function dbClear(store) {
    const db = await openDB();
    return wrap(db.transaction(store, "readwrite").objectStore(store).clear());
  }
  async function dbGet(store, key) {
    const db = await openDB();
    return wrap(db.transaction(store, "readonly").objectStore(store).get(key));
  }

  function coverUrl(item) {
    if (!item.imageBlob) return null;

  async function createItems(inputs) {
    const now = Date.now();
    const items = inputs.map((input, i) => Object.assign(
      { favorite: false, tags: [], boardIds: [] }, input,
      { id: input.id || uid(), createdAt: input.createdAt || now - i, updatedAt: now - i },
    ));
    state.items.unshift(...items);
    await dbPutMany(S_ITEMS, items);
    return items;
  }

    const index = state.items.findIndex((i) => i.id === id);
    if (index === -1) return;
    const next = Object.assign({}, state.items[index], patch, { id, updatedAt: Date.now() });
    state.items[index] = next;
    await dbPut(S_ITEMS, next);

• Cola a URL na barra de cima e dá Enter.

• Board é assunto amplo. Tag é o detalhe. Uma referência pode estar em vários boards.` },
    { title: "Ideia: página de planos com comparação honesta", board: 3, tags: ["pricing", "produto"],
      body: `Em vez da tabela de 3 colunas de sempre, começar perguntando "quantas pessoas usam?" e mostrar só o plano que faz sentido.
